# Helix CI：MessageV3 real-chain 是合并与分支流水线的唯一业务验收入口。
# `scripts/gate.sh` 仍可供本地/人工使用，但 CI 不再把它或 api-surface 当作主门禁。
# real-chain 的 pre/local/自定义环境由 scripts/messagev3/real-chain-environment.mjs
# 与下列 profile/端点变量共同解析；默认 profile 为 pre，端点默认值只在该配置表维护一份。

stages:
  - messagev3

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  MESSAGEV3_CI_IMAGE: "harbor.jinqidongli.com/infra-ops/gitlab/rust:1.95.0_with_tools"
  # 完整 Phase 批次启用最多五个频道和按账号复用的保活 WS；设为 0 可回退逐 Gate 隔离调试。
  MESSAGEV3_PHASE_POOL: "1"

default:
  # 镜像必须同时提供 Rust 1.95、wasm32 target、cargo fmt/clippy 与 Node.js 20+。
  # 若私仓现有 rust 镜像未烤入 Node，可在 GitLab 项目变量覆盖 MESSAGEV3_CI_IMAGE，
  # 或由 ops 更新同名镜像；不能在 job 中临时联网安装运行时。
  image: "$MESSAGEV3_CI_IMAGE"
  tags:
    - docker
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
  before_script:
    - command -v node >/dev/null 2>&1 || { echo "❌ CI image lacks Node.js 20+; set MESSAGEV3_CI_IMAGE"; exit 1; }
    - |
      node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20) { console.error(`❌ Node.js 20+ required, found ${process.version}`); process.exit(1); }'
    - rustup component list --installed
    - rustup target list --installed | grep -qx wasm32-unknown-unknown
    - cargo fmt --version && cargo clippy --version

messagev3-real-chain:
  stage: messagev3
  resource_group: messagev3-pre
  timeout: 30m
  script:
    # Masked JSON 为首选；File 变量只保留为兼容兜底，两者都不会写入 artifact。
    - test -n "${CSES_WDIO_CREDENTIALS_JSON:-}${CSES_WDIO_CREDENTIALS_FILE:-}" || { echo "❌ missing masked CSES_WDIO_CREDENTIALS_JSON (or File fallback)"; exit 1; }
    - test -z "${CSES_WDIO_CREDENTIALS_FILE:-}" || test -f "$CSES_WDIO_CREDENTIALS_FILE" || { echo "❌ CSES_WDIO_CREDENTIALS_FILE is not a file"; exit 1; }
    - node scripts/messagev3/phase1-5-real-chain.mjs --all --env pre
  artifacts:
    when: always
    paths:
      - artifacts/messagev3-phase1-5-real-chain/
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
