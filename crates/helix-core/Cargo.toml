[package]
name        = "cses-helix-core"
version     = "0.1.86"
edition     = "2021"
authors     = ["CSES Team"]
license     = "MIT OR Apache-2.0"
description = "运行时无关的确定性业务内核与 sans-IO 执行壳"
repository  = "https://git.yundiz.com/cses/go/helix"
readme      = "README.md"
include     = ["/src/**", "/README.md"]

[lib]
# 发布包改名不改变稳定的 Rust crate import 名称。
name = "helix_core"

# helix-core 是三栖共享的纯库，crate-type 默认 rlib
# ❌ 绝对不含：tokio / sqlx / reqwest / tokio-tungstenite / rusqlite / web-sys / tauri
#    platform::spawn 已移至各 driver 的 engine_loop.rs，此处无任何运行时依赖

[features]
# testing: 启用 MockClock 等测试工具（生产构建不启用，避免 wasm32 atomics 依赖）
testing = []

[dependencies]
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
bytes           = { workspace = true }
async-trait     = { workspace = true }
futures-channel = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
# 集成测试（tests/*.rs）是独立 crate，需显式声明用到的普通依赖
bytes = { workspace = true }

# 编译期护栏（Bun 对齐 2.1/2.4）：deny ambient 时间/线程/打印——纪律变契约
[lints.clippy]
disallowed_methods = "deny"
disallowed_macros = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
