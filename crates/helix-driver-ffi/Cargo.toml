[package]
name    = "helix-driver-ffi"
version = "0.1.0"
edition = "2021"

# FFI driver：C ABI + uniffi，编译为 cdylib + staticlib
[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
helix-core = { path = "../helix-core" }
helix-driver-host = { path = "../helix-driver-host" }
serde       = { workspace = true }
thiserror   = { workspace = true }
bytes       = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
futures-channel = { workspace = true }

# FFI 绑定（cbindgen 在 build.rs 生成 helix.h）
# uniffi = { version = "0.28", features = ["scaffolding"] }  # 按需开启

# driver 层是 ambient API（SystemTime/线程）的唯一合法落点 → 不开 disallowed deny
[lints.clippy]
undocumented_unsafe_blocks = "deny"
disallowed_methods = "allow"
disallowed_macros = "allow"
