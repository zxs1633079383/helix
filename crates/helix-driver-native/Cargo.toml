[package]
name    = "helix-driver-native"
version = "0.1.0"
edition = "2021"

# native driver：tokio multi-thread + sqlx + tungstenite + reqwest
# tokio::spawn 在此 crate 的 engine_loop.rs，不在 helix-core

[dependencies]
helix-core = { path = "../helix-core" }
helix-driver-host = { path = "../helix-driver-host" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
bytes       = { workspace = true }
tracing     = { workspace = true }

# 运行时（仅 native）
tokio            = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest          = { version = "0.12", features = ["json"] }
async-trait      = { workspace = true }
futures-channel  = { workspace = true }
futures-util     = "0.3"

# driver 层是 ambient API（SystemTime/线程）的唯一合法落点 → 不开 disallowed deny
[lints.clippy]
undocumented_unsafe_blocks = "deny"
disallowed_methods = "allow"
disallowed_macros = "allow"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "storage_upsert"
harness = false

[[bench]]
name = "engine_bench"
harness = false
