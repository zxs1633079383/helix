[package]
name    = "helix-driver-wasm"
version = "0.1.0"
edition = "2021"

# wasm driver：wasm-bindgen + web-sys + sqlite-wasm-rs
# 编译为 cdylib 供 wasm-pack 打包为 .wasm + JS glue
# MIN-6: 加 rlib，供 Rust 集成测试引用（wasm-pack 用 cdylib，Rust test 用 rlib）
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
helix-core = { path = "../helix-core" }
serde       = { workspace = true }
thiserror   = { workspace = true }
bytes       = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }

# wasm 专属依赖
[target.'cfg(target_arch = "wasm32")'.dependencies]
# MIN-5: getrandom "js" feature 仅在 wasm32 下需要，避免污染 native 构建
getrandom            = { workspace = true, features = ["js"] }
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
# web-sys features 按需打开（不开全，控制 .wasm 体积）
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Blob",
    "FileReaderSync",
    # MAJ-3: Worker 上下文检测（OPFS 只能在 Worker 内初始化）
    "DedicatedWorkerGlobalScope",
] }
gloo-timers  = { version = "0.3", features = ["futures"] }
# sqlite-wasm-rs：OPFS 持久化
# ⚠️ 必须在 Web Worker 内初始化，需要编译标志：
#    RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals"
# sqlite-wasm-rs = "0.1"  # TODO: 添加版本后取消注释
