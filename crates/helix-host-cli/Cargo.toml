[package]
name    = "helix-host-cli"
version = "0.1.0"
edition = "2021"

# 最小 native 宿主（sync-v2 Phase A1）：把 ExecutionShell + ImModule + NativeTransport
# 接成端到端可跑闭环，验证 Effect::Send 真发 WS。host 层 = ambient API 合法落点。

[[bin]]
name = "helix-host-cli"
path = "src/main.rs"

[[bin]]
name = "helix-store-inspect"
path = "src/store_inspect_main.rs"

[dependencies]
helix-core          = { package = "cses-helix-core", path = "../helix-core", version = "=0.1.78" }
helix-im            = { path = "../helix-im" }
helix-driver-host   = { path = "../helix-driver-host" }
helix-driver-native = { path = "../helix-driver-native" }

tokio              = { version = "1", features = ["full"] }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# stdin 遥控器：命令行 → JSON payload → Tick::Command（host 层装配，非 core/im）
serde_json         = { workspace = true }
bytes              = { workspace = true }
# 配置去 env 化（PRD §4.2）：单一 helix.config.yaml 真源。
# serde_norway = 维护中的 serde_yaml 继任者（serde_yaml 已 archived，不用）。
serde              = { workspace = true }
serde_norway       = "0.9"
rusqlite           = { version = "0.32.1", features = ["bundled"] }
sha2               = "0.10"
thiserror          = { workspace = true }

# host/driver 层是 ambient API（SystemTime/线程/打印）的合法落点
[lints.clippy]
disallowed_methods = "allow"
disallowed_macros  = "allow"
