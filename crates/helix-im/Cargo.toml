[package]
name    = "helix-im"
version = "0.1.0"
edition = "2021"

# helix-im 只依赖 helix-core（唯一外部 crate 依赖）
# ❌ 绝对不含：tokio / sqlx / reqwest / tungstenite / web-sys / tauri
# IM 业务逻辑通过 Effect 表达意图，driver 兑现，保证三栖可编译

[dependencies]
helix-core = { path = "../helix-core" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
bytes       = { workspace = true }
inventory   = "0.3"
tracing     = { workspace = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
sha2 = "0.10"
jsonschema = "0.33"

