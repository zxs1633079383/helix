# cargo-deny 配置（Bun 对齐 2.7）：装 cargo-deny 后 `cargo deny check` 生效
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "OpenSSL", "CDLA-Permissive-2.0"]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
