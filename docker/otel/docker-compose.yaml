services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    command:
      - "--collector.otlp.enabled=true"
    ports:
      - "16686:16686"
      - "4319:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    command:
      - "--config=/etc/otelcol/otel-collector.yaml"
    volumes:
      - "./otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro"
    extra_hosts:
      - "helix-host:host-gateway"
    environment:
      HELIX_PRE_OTLP_ENDPOINT: ${HELIX_PRE_OTLP_ENDPOINT:-192.168.65.254:14317}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus_data:/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

volumes:
  prometheus_data:
