groups:
  - name: helix-runtime-performance-pre
    interval: 30s
    rules:
      - record: otel:helix_operations:rate5m
        expr: sum by (service_name, platform, scenario, channel_shape, stage, operation, status) (rate(otel_helix_operations_total[5m]))
      - record: otel:helix_http:rps5m
        expr: sum by (service_name, platform, scenario, operation, status) (rate(otel_helix_operations_total{stage="http"}[5m]))
      - record: otel:helix_ws:rps5m
        expr: sum by (service_name, platform, scenario, direction, operation, status) (rate(otel_helix_operations_total{stage="ws"}[5m]))
      - record: otel:helix_storage:qps5m
        expr: sum by (service_name, platform, scenario, storage_op, status) (rate(otel_helix_operations_total{stage="storage"}[5m]))
      - record: otel:helix_event:rps5m
        expr: sum by (service_name, platform, scenario, operation, status) (rate(otel_helix_operations_total{stage="event"}[5m]))
      - record: otel:helix_errors:rate5m
        expr: sum by (service_name, platform, scenario, stage, operation, error_kind) (rate(otel_helix_errors_total[5m]))
      - record: otel:helix_errors:ratio5m
        expr: sum by (service_name, platform, scenario, stage, operation) (rate(otel_helix_operations_total{status="error"}[5m])) / clamp_min(sum by (service_name, platform, scenario, stage, operation) (rate(otel_helix_operations_total[5m])), 0.000001)
      - record: otel:helix_http_duration:p95_5m
        expr: histogram_quantile(0.95, sum by (service_name, platform, scenario, operation, le) (rate(otel_helix_http_request_duration_seconds_bucket[5m])))
      - record: otel:helix_http_duration:p99_5m
        expr: histogram_quantile(0.99, sum by (service_name, platform, scenario, operation, le) (rate(otel_helix_http_request_duration_seconds_bucket[5m])))
      - record: otel:helix_tick_queue_wait:p95_5m
        expr: histogram_quantile(0.95, sum by (service_name, platform, scenario, tick_kind, le) (rate(otel_helix_tick_queue_wait_seconds_bucket[5m])))
      - record: otel:helix_pool_residency:p95_5m
        expr: histogram_quantile(0.95, sum by (service_name, platform, scenario, pool, le) (rate(otel_helix_pool_queue_residency_seconds_bucket[5m])))
      - record: otel:helix_pool_execution:p95_5m
        expr: histogram_quantile(0.95, sum by (service_name, platform, scenario, pool, le) (rate(otel_helix_pool_execution_seconds_bucket[5m])))
      - record: otel:helix_client_consumer_lag:rate5m
        expr: sum by (service_name, platform, scenario, consumer) (rate(otel_helix_event_lagged_total[5m]))
      - record: otel:helix_telemetry_drop:rate5m
        expr: sum by (service_name, platform, scenario, __name__) (rate({__name__=~"otel_helix_(metrics|traces)_dropped_total"}[5m]))
      - record: otel:helix_correctness:increase30m
        expr: sum by (service_name, platform, scenario, __name__) (increase({__name__=~"otel_helix_(lost|duplicate|order_violation|wrong_channel|cursor_regression|projection_mismatch|persist_remaining|cleanup_residue)_total"}[30m]))
  - name: messagev3-business-reliability
    interval: 30s
    rules:
      - record: im:message_persist_success_ratio
        expr: sum by (job, environment) (increase(im_message_persist_terminal_total{result="success"}[1h]) and on(job, environment, instance) (up == 1)) / sum by (job, environment) (increase(im_message_persist_terminal_total[1h]) and on(job, environment, instance) (up == 1))
      - record: im:message_remote_persist_inserted_per_second
        expr: sum by (job, environment) (rate(im_message_remote_persist_messages_total{outcome="inserted"}[5m]) and on(job, environment, instance) (up == 1))
      - record: im:message_remote_persist_deduplicated_per_second
        expr: sum by (job, environment) (rate(im_message_remote_persist_messages_total{outcome="deduplicated"}[5m]) and on(job, environment, instance) (up == 1))
      - record: im:delivery_outbox_success_ratio
        expr: sum by (job, environment) (increase(im_delivery_outbox_lifecycle_total{stage="mark_delivered",result="success"}[1h]) and on(job, environment, instance) (up == 1)) / sum by (job, environment) (increase(im_delivery_outbox_lifecycle_total{stage="created",result="success"}[1h]) and on(job, environment, instance) (up == 1))
      - record: im:recipient_enqueue_success_ratio
        expr: sum by (job, environment) (increase(im_ws_hub_delivery_events_total{result="enqueued"}[1h]) and on(job, environment, instance) (up == 1)) / sum by (job, environment) (increase(im_ws_hub_delivery_events_total{result=~"enqueued|slow_consumer"}[1h]) and on(job, environment, instance) (up == 1))
      - record: im:client_ack_success_ratio
        expr: sum by (job, environment, platform) (increase(im_message_client_ack_total{result="success"}[1h]) and on(job, environment, instance) (up == 1)) / sum by (job, environment, platform) (increase(im_message_client_ack_total[1h]) and on(job, environment, instance) (up == 1))
      - record: helix:im_client_ack_success_ratio
        expr: sum by (job, deployment_environment, platform) (increase(otel_helix_im_client_ack_terminal_total{status="success"}[6h])) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_client_ack_terminal_total[6h]))
      - record: helix:im_projection_success_ratio
        expr: sum by (job, deployment_environment, platform) (increase(otel_helix_im_projection_terminal_total{status="success"}[6h])) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_projection_terminal_total[6h]))
      - record: helix:im_sync_session_success_ratio
        expr: sum by (job, deployment_environment, platform) (increase(otel_helix_im_sync_session_total{status="success"}[6h])) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_sync_session_total[6h]))
      - record: helix:im_sync_anomaly_ratio
        expr: (sum by (job, deployment_environment, platform) (increase(otel_helix_im_sync_anomaly_total{status="error"}[6h])) or 0 * sum by (job, deployment_environment, platform) (increase(otel_helix_im_sync_session_total[6h]))) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_sync_session_total[6h]))
      - record: helix:im_recovery_success_ratio
        expr: sum by (job, deployment_environment, platform) (increase(otel_helix_im_recovery_session_total{status="success"}[6h])) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_recovery_session_total[6h]))
      - record: helix:im_unread_mismatch_ratio
        expr: (sum by (job, deployment_environment, platform) (increase(otel_helix_im_unread_reconcile_total{status="mismatch"}[6h])) or 0 * sum by (job, deployment_environment, platform) (increase(otel_helix_im_unread_reconcile_total[6h]))) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_unread_reconcile_total[6h]))
      - record: helix:im_message_correctness_error_ratio
        expr: (sum by (job, deployment_environment, platform) (increase(otel_helix_im_message_correctness_total{status="error"}[6h])) or 0 * sum by (job, deployment_environment, platform) (increase(otel_helix_im_message_correctness_total[6h]))) / sum by (job, deployment_environment, platform) (increase(otel_helix_im_message_correctness_total[6h]))
      - record: helix:im_command_terminal_success_ratio
        expr: sum by (job, deployment_environment, platform, operation) (increase(otel_helix_im_command_terminal_total{status="success"}[6h])) / sum by (job, deployment_environment, platform, operation) (increase(otel_helix_im_command_terminal_total[6h]))
      - record: im:message_remote_persist_duration:p50_5m
        expr: histogram_quantile(0.50, sum by (job, environment, le) (rate(im_message_lifecycle_duration_seconds_bucket{stage="remote_persist",result="success"}[5m]) and on(job, environment, instance) (up == 1)))
      - record: im:message_remote_persist_duration:p95_5m
        expr: histogram_quantile(0.95, sum by (job, environment, le) (rate(im_message_lifecycle_duration_seconds_bucket{stage="remote_persist",result="success"}[5m]) and on(job, environment, instance) (up == 1)))
      - record: im:message_remote_persist_duration:p99_5m
        expr: histogram_quantile(0.99, sum by (job, environment, le) (rate(im_message_lifecycle_duration_seconds_bucket{stage="remote_persist",result="success"}[5m]) and on(job, environment, instance) (up == 1)))
      - record: helix:message_projection_duration:p50_5m
        expr: histogram_quantile(0.50, sum by (job, deployment_environment, platform, le) (rate(otel_helix_command_to_projection_emit_seconds_bucket[5m])))
      - record: helix:message_projection_duration:p95_5m
        expr: histogram_quantile(0.95, sum by (job, deployment_environment, platform, le) (rate(otel_helix_command_to_projection_emit_seconds_bucket[5m])))
      - record: helix:message_projection_duration:p99_5m
        expr: histogram_quantile(0.99, sum by (job, deployment_environment, platform, le) (rate(otel_helix_command_to_projection_emit_seconds_bucket[5m])))
