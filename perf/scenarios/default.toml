schema_version = 1

[run]
scenario = "L2-ENGINE-MIXED"
platform = "native-macos"
channel_shape = "parallel-50"
rate = 100
rate_unit = "events_per_second"
payload_bucket = "2KiB"

[windows]
warmup = "200ms"
load = "2s"
drain = "250ms"
observation = "250ms"

[topology]
channels = 50
senders = 1
receivers = 1

[thresholds]
profile = "calibration-v1"
max_telemetry_p99_overhead_ratio = 1.30
max_queue_wait_p99_ms = 10.0
max_drop_ratio_rated = 0.001
min_saturation_drops = 1
